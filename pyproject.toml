[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "failurelab"
version = "0.12.0"
description = "Automated failure discovery, robustness testing, and regression gating for machine learning models."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

authors = [
    { name = "Harun Musa" }
]

keywords = [
    "machine-learning",
    "robustness",
    "model-testing",
    "computer-vision",
    "mlops",
    "stress-testing",
    "model-evaluation",
    "regression-testing"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing"
]

dependencies = [
    "numpy>=1.24",
    "pillow>=9.0"
]


[project.optional-dependencies]
vision = [
    "torch",
    "torchvision"
]

visualization = [
    "matplotlib>=3.7"
]

dev = [
    "pytest",
    "pytest-cov",
    "build"
]

all = [
    "failurelab[vision,visualization,dev]"
]


[project.scripts]
failurelab = "failurelab.cli:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["failurelab*"]


[tool.pytest.ini_options]
testpaths = ["tests"]